[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]

name = "toolkit"
version = "1.0.0"
description = "лаба CLI toolkit: калькулятор и перевод величин"
requires-python = ">=3.10"

[project.scripts]
toolkit = "toolkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]